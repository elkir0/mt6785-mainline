%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/himax,hx83102p.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Himax HX83102 TDDI touchscreen and pen controller

maintainers:
  - The Lenovomarchy authors

description: |
  The HX83102 is a touch and display driver integrated (TDDI) device.
  Its touch MCU has no firmware flash: the host uploads the touch
  firmware into the chip SRAM over SPI after every power-up, resume and
  exception, then verifies it with the chip's CRC engine. The controller
  reports up to ten fingers and one active pen with pressure, tilt and
  barrel buttons.

  The touch firmware must be present in /lib/firmware (default
  himax/hx83102p.bin, override with firmware-name).

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: himax,hx83102p-ts

  reg:
    maxItems: 1

  spi-max-frequency: true

  interrupts:
    maxItems: 1
    description: Touch interrupt (TSIX), falling edge

  reset-gpios:
    maxItems: 1
    description: External reset (XRES), active low, shared with the
      display side of the TDDI chip

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Name of the zero-flash touch firmware file to request from the
      firmware loader. Defaults to himax/hx83102p.bin.

  panel: true

  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-swapped-x-y: true

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "himax,hx83102p-ts";
            reg = <0>;
            spi-max-frequency = <9600000>;
            interrupt-parent = <&pio>;
            interrupts = <1 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&pio 2 GPIO_ACTIVE_LOW>;
            firmware-name = "himax/hx83102p.bin";
            panel = <&panel>;
            touchscreen-size-x = <1200>;
            touchscreen-size-y = <2000>;
        };
    };

...
