%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k4h7.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K4H7 Image Sensor

description:
  Samsung S5K4H7 (S5K4H7YX family, chip ID 0x487b) 8Mpixel raw image
  sensor. The sensor is controlled over a CCI (I2C-compatible) bus, the
  widest supported output image frame size is 3264x2448 at 30 frames
  per second, data output format is RAW10 transferred over a 4-lane
  MIPI D-PHY interface at 700 Mbps per lane.

maintainers:
  - Anthony Dhaene <anthony.dhaene@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k4h7

  reg:
    description: I2C slave address of the sensor.
    maxItems: 1

  clocks:
    description: MCLK supply clock, 24 MHz.
    maxItems: 1

  reset-gpios:
    description: |
      Active low GPIO connected to the RESET pad of the sensor. On the
      reference implementation the line is high while the sensor runs
      and is pulled low to enter hardware reset.
    maxItems: 1

  avdd-supply:
    description: Analogue voltage supply, 2.8 volts.

  dvdd-supply:
    description: Digital core voltage supply, 1.05 - 1.2 volts.

  dovdd-supply:
    description: Digital I/O voltage supply, 1.8 volts.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@2d {
              compatible = "samsung,s5k4h7";
              reg = <0x2d>;

              clocks = <&camtg3_clk>;
              assigned-clocks = <&camtg3_clk>;
              assigned-clock-rates = <24000000>;
              reset-gpios = <&pio 124 GPIO_ACTIVE_LOW>;
              avdd-supply = <&cam_vcama_reg>;
              dvdd-supply = <&cam_vcamd_reg>;
              dovdd-supply = <&mt6359_vcamio_ldo_reg>;

              port {
                  s5k4h7_out: endpoint {
                      remote-endpoint = <&seninf_in>;
                      data-lanes = <1 2 3 4>;
                      link-frequencies = /bits/ 64 <700000000>;
                  };
              };
          };
      };
...
